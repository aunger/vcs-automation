version: 2
updates:
  # Third-party actions: "/" covers the workflows, and "/*" each action's
  # <action>/action.yml, which Dependabot reads only in a directory it is given.
  # The actions use none today; test_action_files.py requires any that one adds
  # to be pinned to a full commit SHA, and checks this entry still reaches every
  # action's directory.
  - package-ecosystem: "github-actions"
    directories:
      - "/"
      - "/*"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "11:00"
      timezone: "UTC"

  # The hash-pinned Python locks: requirements.txt for the scripts, and
  # dependency-audit/requirements-audit.txt for pip-audit.
  # Each lock is `uv pip compile --universal --python-version 3.11 --generate-hashes`
  # output from the .in beside it, which the "uv" ecosystem regenerates with the
  # same flags; the "pip" ecosystem would not.
  # `dependency-type: all` lets it propose a bump to a package that only the
  # lock names, which is where most advisories land.
  #
  # One entry per lock directory, so each lock is reached once (issue #16).
  # The uv file fetcher reads requirement files from the directory it is given
  # and from each directory immediately below it, so "/" alone also reaches
  # dependency-audit/, and compiles that lock with paths relative to "/", which
  # rewrites its `# via -r requirements-audit.in` lines.
  # The "/" entry therefore excludes dependency-audit, which its own entry
  # compiles from where the lock's header says it was made.
  # The exclusion cannot sit in a shared entry with both directories: the
  # fetcher matches it against paths from the repository root, so it would hide
  # dependency-audit/ from the "/dependency-audit" directory as well.
  #
  # The groups split each entry's .in pins from everything they pull in, so a
  # tool bump that needs work cannot hold back a fix to a lock-only package.
  # python-transitive is `*` minus the pins, so a package a future bump pulls in
  # joins it without an edit here.
  # Names are PEP 503-normalized (pyyaml, not PyYAML), the form the uv parser
  # gives. test_action_files.py checks these lists against the .in pins, less
  # its WORKAROUND_PINS (typing-extensions, which requirements-audit.in explains),
  # and that each requirements file is reached by exactly one entry.
  # Two groups want at most two pull requests per entry, inside the default limit
  # of 5, so there is no `open-pull-requests-limit`.
  - package-ecosystem: "uv"
    directory: "/"
    exclude-paths:
      - "dependency-audit/**"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "12:00"
      timezone: "UTC"
    allow:
      - dependency-type: "all"
    groups:
      python-direct:
        patterns:
          - "pyyaml"
      python-transitive:
        patterns:
          - "*"
        exclude-patterns:
          - "pyyaml"

  - package-ecosystem: "uv"
    directory: "/dependency-audit"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "12:00"
      timezone: "UTC"
    allow:
      - dependency-type: "all"
    groups:
      python-direct:
        patterns:
          - "pip-audit"
      python-transitive:
        patterns:
          - "*"
        exclude-patterns:
          - "pip-audit"

  # The Claude Code CLI that test.yml's tests job installs to run
  # `claude plugin validate` in test_plugin_marketplace.sh. Its version is exact
  # in .github/claude-code/package.json, and the job installs it with `npm ci`
  # from the committed package-lock.json beside it, so this entry is what moves
  # it: each bump arrives as a pull request whose CI runs the validate with the
  # new version. The directory holds that manifest and nothing else, and the
  # platform packages are optionalDependencies of the one direct dependency, so
  # they move in the same pull request.
  # 13:00 Monday keeps the run an hour clear of the uv entries above.
  - package-ecosystem: "npm"
    directory: "/.github/claude-code"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "13:00"
      timezone: "UTC"
